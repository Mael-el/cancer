# Supabase Configuration for Ayidodé+ Bénin
project_id = "ayidode-benin-sante"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://*"]
jwt_expiry = 3600
enable_signup = true

[functions.chat]
verify_jwt = false

[functions.inscription]
verify_jwt = false

[functions.questionnaire]
verify_jwt = false

[functions.rappels-planifier]
verify_jwt = true

[functions.rappels-envoyer]
verify_jwt = true

[functions.orientation]
verify_jwt = false

[functions.statistiques]
verify_jwt = true

[functions.export-bailleurs]
verify_jwt = true

[functions.voix]
verify_jwt = false

[functions.appel-infirmier]
verify_jwt = false
